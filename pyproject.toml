[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trail-agent"
version = "0.1.0"
description = "Session-scoped, interruptible agent runtime for Trail"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
trail = "trail.__main__:main"

[tool.setuptools.packages.find]
include = ["trail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
