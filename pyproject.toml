[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trail-agent"
version = "0.2.0"
description = "Trail: an interruptible cursor agent with speculative forks, two-way interruptibility and transactional tools"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1", "av>=12,<15"]
cloud = ["google-genai>=1.0"]
desktop = ["websockets>=12", "pywinauto>=0.6.8; sys_platform == 'win32'", "mss>=9"]
test = ["pytest>=8,<10"]
eval = ["matplotlib>=3.8"]

[project.scripts]
trail = "trail.__main__:main"

[tool.setuptools.packages.find]
include = ["trail*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
